<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>插件页 — 静态 demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <style>
      .alert { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 16px; border-radius: var(--radius-card);
        background: color-mix(in oklab, var(--destructive) 8%, var(--card)); outline: 1px solid color-mix(in oklab, var(--destructive) 25%, transparent); outline-offset: -1px; }
      .alert[hidden] { display: none; }
      .alert b { font-weight: 500; }
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
      .toolbar .input { width: 260px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }
      .plugin { min-width: 0; display: grid; gap: 12px; align-content: start; }
      .plugin[data-disabled='true'] .plugin-main { opacity: .55; }
      .plugin[data-failed='true'] { outline-color: color-mix(in oklab, var(--destructive) 35%, transparent); }
      .plugin-head { display: flex; gap: 12px; align-items: flex-start; }
      .plugin-main { display: flex; gap: 12px; align-items: flex-start; flex: 1; min-width: 0; }
      .icon { flex: none; width: 40px; height: 40px; border-radius: var(--radius-2xl); background: var(--muted); display: grid; place-items: center; font-family: var(--font-heading); font-weight: 600; font-size: 15px; }
      .plugin h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .pkg { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .desc { margin: 0; font-size: 13px; color: var(--muted-foreground); line-height: 1.5; }
      .diag { margin: 0; padding: 8px 10px; border-radius: var(--radius-md); font-size: 12.5px; background: color-mix(in oklab, var(--destructive) 10%, transparent); color: var(--destructive); }
      .plugin-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
      .plugin-foot .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chart-success); }
      .dot[data-s='failed'] { background: var(--chart-error); }
      .dot[data-s='off'] { background: var(--muted-foreground); opacity: .5; }
      .btn[data-variant='danger'] { color: var(--destructive); }
      .switch { position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; border: 0; padding: 0; background: var(--border); transition: background .12s; }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .12s; box-shadow: 0 1px 2px oklch(0 0 0 / 20%); }
      .switch[aria-checked='true'] { background: var(--primary); }
      .switch[aria-checked='true']::after { transform: translateX(14px); }
      .empty { grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--muted-foreground); }
      .add-card { border: 1px dashed var(--border); outline: 0; background: transparent; box-shadow: none; display: grid; place-items: center; min-height: 148px; color: var(--muted-foreground); gap: 4px; text-align: center; }
      .add-card:hover { background: var(--accent); color: var(--foreground); }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <nav class="crumbs"><span>配置</span><span>/</span><span style="color: var(--foreground)">插件</span></nav>
        <div class="spacer"></div>
        <button class="btn" data-variant="ghost" data-theme-toggle>深浅色</button>
        <button class="btn" style="background: var(--primary); color: var(--primary-foreground); border-color: transparent">安装插件</button>
      </div>

      <div class="alert" id="alert" hidden>
        <span class="dot" data-s="failed"></span>
        <span><b id="alert-count"></b> 个插件加载失败,其提供的 Provider 暂不可用。</span>
        <div class="spacer"></div>
        <button class="btn" id="alert-view">查看</button>
      </div>

      <div class="toolbar">
        <input class="input" id="q" type="search" placeholder="搜索名称或包名" />
        <div class="seg" id="seg"></div>
        <div class="spacer"></div>
        <span class="muted" id="count"></span>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <script type="module">
      const root = document.documentElement;
      root.classList.toggle('dark', localStorage.getItem('demo-theme') === 'dark');
      document.querySelector('[data-theme-toggle]').addEventListener('click', () => {
        localStorage.setItem('demo-theme', root.classList.toggle('dark') ? 'dark' : 'light');
      });

      // Mirrors DashboardPluginSummary: packageName, displayName, version, builtin, enabled, state, hasOptions.
      const plugins = [
        { pkg: '@aio-proxy/plugin-github-copilot', name: 'GitHub Copilot', ver: '0.14.2', builtin: true, enabled: true, options: true, desc: '使用 GitHub Copilot 订阅作为 OAuth Provider,自动刷新令牌与模型目录。' },
        { pkg: '@aio-proxy/plugin-openai-chatgpt', name: 'OpenAI Codex', ver: '0.14.2', builtin: true, enabled: true, options: true, desc: '通过 ChatGPT 账号登录并路由 Codex 模型。' },
        { pkg: '@aio-proxy/plugin-claude-code', name: 'Claude Code', ver: '0.14.2', builtin: true, enabled: false, options: false, desc: '复用 Claude Code 订阅额度,支持 Messages 协议直通。' },
        { pkg: '@acme/aio-plugin-bedrock', name: 'AWS Bedrock', ver: '1.3.0', builtin: false, enabled: true, options: true, desc: 'SigV4 签名的 Bedrock 上游,支持区域与跨区推理配置。' },
        { pkg: '@acme/aio-plugin-vertex', name: 'Vertex AI', ver: '0.9.1', builtin: false, enabled: true, options: true, failed: '无法加载入口模块:缺少导出 "default"(PLUGIN_LOAD_FAILED)' },
        { pkg: 'aio-plugin-local-llm', name: null, ver: undefined, builtin: false, enabled: true, options: false, failed: '包未安装,请重新安装或卸载该插件(PLUGIN_NOT_FOUND)' },
      ];

      const filters = { all: '全部', enabled: '已启用', failed: '异常', builtin: '内置' };
      let filter = 'all';
      const $ = (id) => document.getElementById(id);
      const initial = (p) => (p.name ?? p.pkg.replace(/^@[^/]+\//, '').replace(/^(aio-)?plugin-/, ''))[0].toUpperCase();
      const match = { all: () => true, enabled: (p) => p.enabled, failed: (p) => p.failed, builtin: (p) => p.builtin };

      const card = (p) => {
        const s = p.failed ? 'failed' : p.enabled ? 'ready' : 'off';
        const label = { failed: '加载失败', ready: '运行中', off: '已停用' }[s];
        return `<article class="card plugin" data-disabled="${!p.enabled}" data-failed="${!!p.failed}" data-pkg="${p.pkg}">
          <div class="plugin-head">
            <div class="plugin-main">
              <div class="icon">${initial(p)}</div>
              <div style="min-width: 0">
                <h3>${p.name ?? p.pkg}${p.builtin ? '<span class="badge" data-status="outline">内置</span>' : ''}</h3>
                <div class="pkg mono muted">${p.name ? p.pkg : ''}${p.ver ? (p.name ? ' · ' : '') + 'v' + p.ver : ''}</div>
              </div>
            </div>
            <button class="switch" role="switch" aria-checked="${p.enabled}" aria-label="启用 ${p.name ?? p.pkg}"></button>
          </div>
          ${p.failed ? `<p class="diag">${p.failed}</p>` : `<p class="desc">${p.desc}</p>`}
          <div class="plugin-foot">
            <span class="status"><span class="dot" data-s="${s}"></span>${label}</span>
            <div class="spacer"></div>
            ${p.options ? '<button class="btn" data-variant="ghost">选项</button>' : ''}
            ${p.builtin ? '' : '<button class="btn" data-variant="ghost" data-danger>卸载</button>'}
          </div>
        </article>`;
      };

      const render = () => {
        const q = $('q').value.trim().toLowerCase();
        const list = plugins.filter((p) => match[filter](p) && `${p.name ?? ''} ${p.pkg}`.toLowerCase().includes(q));
        const failed = plugins.filter((p) => p.failed).length;
        $('alert').hidden = failed === 0 || filter === 'failed';
        $('alert-count').textContent = failed;
        $('count').textContent = `${list.length} / ${plugins.length}`;
        $('seg').innerHTML = Object.entries(filters)
          .map(([k, v]) => `<button data-k="${k}" data-active="${k === filter}">${v}${k === 'failed' && failed ? ` ${failed}` : ''}</button>`)
          .join('');
        $('grid').innerHTML = list.length
          ? list.map(card).join('') + '<button class="card add-card"><b>+ 安装插件</b><span>npm 包名或本地路径</span></button>'
          : '<div class="empty">没有匹配的插件</div>';
      };

      $('q').addEventListener('input', render);
      $('alert-view').addEventListener('click', () => ((filter = 'failed'), render()));
      $('seg').addEventListener('click', (e) => e.target.dataset.k && ((filter = e.target.dataset.k), render()));
      $('grid').addEventListener('click', (e) => {
        const sw = e.target.closest('.switch');
        if (!sw) return;
        const p = plugins.find((x) => x.pkg === sw.closest('.plugin').dataset.pkg);
        p.enabled = !p.enabled;
        render();
      });
      render();
    </script>
  </body>
</html>
