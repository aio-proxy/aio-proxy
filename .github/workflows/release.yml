name: Release

# Changesets owns the release. On every push to main the action either:
#   - maintains the standing "chore: release" Version PR (when changesets exist), or
#   - runs the publish script (when none exist, i.e. right after that PR merged).
# Cutting a release therefore = merging the Version PR. See .changeset/config.json
# and scripts/release.ts.
#
# This job runs on macOS because `bun build --compile --target=bun-darwin-x64`
# still emits a signature macOS 27 rejects (as of Bun 1.4.2), so compile and
# `codesign` must happen on the same machine. See
# packages/cli/scripts/resign-standalone-binary.ts for the current per-arch
# state and the condition for returning this job to ubuntu-latest.
# Compile only runs on the publish path inside scripts/release.ts. The Linux
# Docker image stays on Ubuntu — GitHub macOS runners do not ship Docker.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump commit + git tag(s)
  pull-requests: write # open/update the Version PR
  id-token: write # npm OIDC trusted publishing (+ provenance)
  packages: write # push the Docker image to GHCR

jobs:
  release:
    runs-on: macos-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs['published-packages'] }}
    env:
      # lefthook's postinstall no-ops when CI=true unless LEFTHOOK is set; without
      # installed hooks the release commit skips oxfmt/commitlint (e.g. CHANGELOG.md).
      LEFTHOOK: 'true'
    steps:
      # Job-level env cannot use the runner context — GitHub rejects the workflow
      # at parse time with "Unrecognized named-value: 'runner'". Export via
      # $GITHUB_ENV so publish (scripts/release.ts) and the upload step share one path.
      - name: Set release assets directory
        run: |
          echo "RELEASE_ASSETS_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-assets"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the action can build the Version PR / changelog
          fetch-tags: true
          persist-credentials: false # avoid duplicate Authorization headers during changesets push

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version: '26' # bundles npm 11.17+, which supports OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile --prefer-offline

      # The standing Version PR also runs this workflow. Only a lockstep version
      # newer than the registry is an actual publish, so do not ask for signing
      # material while Changesets is merely maintaining that PR.
      - name: Determine whether CloudKit is being published
        id: cloudkit-release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/plugins/cloudkit/package.json').version")"
          published="$(npm view @aio-proxy/plugin-cloudkit version 2>/dev/null || true)"
          should_prepare="$(node - "$version" "$published" <<'NODE'
          const [current, published] = process.argv.slice(2);
          const parse = (value) => value.split('-')[0].split('.').map((part) => Number.parseInt(part, 10));
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if ((a[index] ?? 0) !== (b[index] ?? 0)) return (a[index] ?? 0) - (b[index] ?? 0);
            }
            return 0;
          };
          process.stdout.write(published === '' || compare(current, published) > 0 ? 'true' : 'false');
          NODE
          )"
          echo "publishable=$should_prepare" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "APPLE_CLOUDKIT_RELEASE_REQUIRED=$should_prepare" >> "$GITHUB_ENV"

      # This is intentionally a macOS-only release step. The native bundle is
      # signed on the same host that builds it, then copied to a temporary path;
      # scripts/release.ts restores that exact archive after the JS build cleans
      # package dist directories and verifies its digest/version before packing.
      - name: Build and sign CloudKit native artifact
        if: steps.cloudkit-release.outputs.publishable == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_CLOUDKIT_CONTAINER_ID: ${{ vars.APPLE_CLOUDKIT_CONTAINER_ID }}
          APPLE_NOTARY_PROFILE: ${{ vars.APPLE_NOTARY_PROFILE }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${APPLE_SIGN_IDENTITY:?APPLE_SIGN_IDENTITY is required}"
          : "${APPLE_CLOUDKIT_CONTAINER_ID:?APPLE_CLOUDKIT_CONTAINER_ID is required}"
          : "${APPLE_NOTARY_PROFILE:?APPLE_NOTARY_PROFILE is required}"
          : "${APPLE_CERTIFICATE_BASE64:?APPLE_CERTIFICATE_BASE64 is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_PROFILE_BASE64:?APPLE_PROFILE_BASE64 is required}"
          : "${APPLE_NOTARY_KEY_BASE64:?APPLE_NOTARY_KEY_BASE64 is required}"
          : "${APPLE_NOTARY_KEY_ID:?APPLE_NOTARY_KEY_ID is required}"
          : "${APPLE_NOTARY_ISSUER_ID:?APPLE_NOTARY_ISSUER_ID is required}"

          keychain="$RUNNER_TEMP/aio-cloudkit-signing.keychain-db"
          certificate="$RUNNER_TEMP/aio-cloudkit-signing.p12"
          certificate_password="$RUNNER_TEMP/aio-cloudkit-signing.password"
          unlocked_certificate="$RUNNER_TEMP/aio-cloudkit-signing.unlocked.pem"
          profile="$RUNNER_TEMP/aio-cloudkit-signing.provisionprofile"
          notary_key="$RUNNER_TEMP/aio-cloudkit-notary-key.p8"
          manifest="packages/plugins/cloudkit/release-manifest.json"
          manifest_backup="$RUNNER_TEMP/aio-cloudkit-release-manifest.json"
          signed_manifest="$RUNNER_TEMP/AIOProxyCloudKit-${{ steps.cloudkit-release.outputs.version }}.manifest.json"
          cp "$manifest" "$manifest_backup"
          restore_manifest() { cp "$manifest_backup" "$manifest"; }
          trap restore_manifest EXIT

          # Keep the temporary keychain password empty. The certificate password
          # is supplied to OpenSSL through a protected file, so it never appears
          # in an external command's argument list. Import the resulting PEM
          # into the temporary keychain without a GUI prompt.
          security create-keychain -p '' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p '' "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_CERTIFICATE_PASSWORD" > "$certificate_password"
          chmod 600 "$certificate" "$certificate_password"
          openssl pkcs12 -in "$certificate" -passin file:"$certificate_password" -nodes -out "$unlocked_certificate"
          chmod 600 "$unlocked_certificate"
          security import "$unlocked_certificate" -k "$keychain" -f pem -T /usr/bin/codesign
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k '' "$keychain"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 -D > "$profile"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$notary_key"
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain"

          version="${{ steps.cloudkit-release.outputs.version }}"
          signed_archive="$RUNNER_TEMP/AIOProxyCloudKit-$version.app.zip"
          printf '{"version":"%s"}\n' "$version" > "$manifest"
          export APPLE_PROFILE_PATH="$profile"
          export APPLE_CLOUDKIT_NATIVE_VERSION="$version"
          export APPLE_CLOUDKIT_SIGNED_ARCHIVE="$signed_archive"
          echo "APPLE_PROFILE_PATH=$APPLE_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "APPLE_CLOUDKIT_NATIVE_VERSION=$APPLE_CLOUDKIT_NATIVE_VERSION" >> "$GITHUB_ENV"
          echo "APPLE_CLOUDKIT_SIGNED_ARCHIVE=$APPLE_CLOUDKIT_SIGNED_ARCHIVE" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_CLOUDKIT_CONTAINER_ID=$APPLE_CLOUDKIT_CONTAINER_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_PROFILE=$APPLE_NOTARY_PROFILE" >> "$GITHUB_ENV"

          bun packages/plugins/cloudkit/scripts/build-native.ts
          bun packages/plugins/cloudkit/scripts/sign-native.ts
          signed="$(find packages/plugins/cloudkit/dist/native -maxdepth 1 -name '*.app.zip' ! -name '*.submission.zip' -print -quit)"
          test -n "$signed"
          cp "$signed" "$signed_archive"
          cp packages/plugins/cloudkit/dist/native/manifest.json "$signed_manifest"
          echo "APPLE_CLOUDKIT_SIGNED_MANIFEST=$signed_manifest" >> "$GITHUB_ENV"

      # Signing is done: build-native/sign-native are the only consumers of the
      # keychain identity, the provisioning profile and the notary key, and the
      # publish script needs nothing but the archive + signed manifest (the CLI
      # binaries are ad-hoc signed). Destroy the key material HERE, before
      # Changesets runs third-party publish code — scripts/release.ts runs
      # `bun update`, so a compromised build dependency must not find a usable
      # Developer ID on disk. `always()` also covers a signing step that failed
      # after writing some of these files.
      - name: Destroy CloudKit signing material
        if: always() && steps.cloudkit-release.outputs.publishable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/aio-cloudkit-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/aio-cloudkit-signing.p12" \
            "$RUNNER_TEMP/aio-cloudkit-signing.password" \
            "$RUNNER_TEMP/aio-cloudkit-signing.unlocked.pem" \
            "$RUNNER_TEMP/aio-cloudkit-signing.provisionprofile" \
            "$RUNNER_TEMP/aio-cloudkit-notary-key.p8"

      # v3-next line (CLI v3). Pinned to the built release tag's commit — `main`
      # does not commit dist/, so a branch/main SHA would not run. Bump this pin
      # (and the @changesets/* devDependencies) together when upgrading.
      - name: Changesets — maintain Version PR or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # This action uses kebab-case inputs and HARD-FAILS if given any legacy
          # name (publish/version/commit/title/setupGitUser/createGithubReleases/…).
          # Defaults we rely on: version-script=`changeset version`,
          # create-github-releases=true, push-git-tags=true, setup-git-user=true —
          # so we only set the publish script and the commit/PR title.
          publish-script: bun run scripts/release.ts
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          # PR creation / GitHub Release / @changesets/changelog-github links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap credential for the FIRST publish of each package: OIDC trusted
          # publishing cannot create a package that does not yet exist on npm (there
          # is nowhere to configure a trusted publisher until the package exists).
          # Set the NPM_TOKEN secret to an automation token for the initial release,
          # then, once every package exists and its trusted publisher is configured
          # on npmjs.com, delete the secret so this resolves to empty and publishing
          # runs on OIDC alone.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets has already published npm, pushed the tag and created the Release.
      # No --clobber: a released attachment must never be silently replaced.
      - name: Upload platform tarballs and SHA256SUMS
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ fromJSON(steps.changesets.outputs['published-packages'])[0].version }}
        run: |
          gh release upload "v$VERSION" "$RELEASE_ASSETS_DIR/"*.tgz --repo aio-proxy/aio-proxy
          gh release upload "v$VERSION" "$RELEASE_ASSETS_DIR/SHA256SUMS" --repo aio-proxy/aio-proxy

      # Safety net only: signing material is already destroyed before Changesets.
      # Repeat those deletions idempotently in case that step was skipped or died
      # partway, and drop the archive/manifest now that the publish script has
      # consumed them.
      - name: Clean CloudKit release artifacts
        if: always() && steps.cloudkit-release.outputs.publishable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/aio-cloudkit-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/aio-cloudkit-signing.p12" \
            "$RUNNER_TEMP/aio-cloudkit-signing.password" \
            "$RUNNER_TEMP/aio-cloudkit-signing.unlocked.pem" \
            "$RUNNER_TEMP/aio-cloudkit-signing.provisionprofile" \
            "$RUNNER_TEMP/aio-cloudkit-notary-key.p8" \
            "$RUNNER_TEMP/aio-cloudkit-release-manifest.json" \
            "$RUNNER_TEMP/AIOProxyCloudKit-${{ steps.cloudkit-release.outputs.version }}.manifest.json"

  docker:
    needs: release
    # Asset upload failure must not block Docker after npm has published.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Publish a multi-arch Docker image to GHCR. Bun cross-compiles both musl
      # targets from this amd64 runner, so buildx builds linux/amd64 and
      # linux/arm64 in one pass without QEMU emulating the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aio-proxy/aio-proxy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ fromJSON(needs.release.outputs['published-packages'])[0].version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  # Retrying notification only downloads the small published checksum manifest.
  homebrew:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ fromJSON(needs.release.outputs['published-packages'])[0].version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Notify the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun run scripts/homebrew-notify.ts "$VERSION"
