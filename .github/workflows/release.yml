name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (leave empty to auto-detect from conventional commits)'
        required: false
        type: choice
        options:
          - ''
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump commit + tag
  id-token: write # npm OIDC trusted publishing (+ provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bumper needs full history + tags to find the last release
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '26' # bundles npm 11.17+, which supports OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Configure git committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        run: bun run scripts/release.ts ${{ inputs.bump && format('--bump={0}', inputs.bump) || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh release create
