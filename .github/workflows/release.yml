name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (leave empty to auto-detect from conventional commits)'
        required: false
        type: choice
        options:
          - ''
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump commit + tag
  id-token: write # npm OIDC trusted publishing (+ provenance)

jobs:
  release:
    # Publish only from the default branch; never from a feature branch or tag dispatch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      # lefthook's postinstall no-ops when CI=true unless LEFTHOOK is set; without
      # installed hooks the release commit skips oxfmt/commitlint (e.g. CHANGELOG.md).
      LEFTHOOK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bumper needs full history + tags to find the last release
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '26' # bundles npm 11.17+, which supports OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Configure git committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        run: bun run scripts/release.ts ${{ inputs.bump && format('--bump={0}', inputs.bump) || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh release create
          # Bootstrap credential for the FIRST publish of each package: OIDC trusted
          # publishing cannot create a package that does not yet exist on npm (there is
          # nowhere to configure a trusted publisher until the package exists). Set the
          # NPM_TOKEN secret to an automation token for the initial release, then, once
          # every package exists and its trusted publisher is configured on npmjs.com,
          # delete the secret so this resolves to empty and publishing runs on OIDC alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # homebrew-tap listens for repository_dispatch aio-proxy-release and opens a
      # formula update PR. GITHUB_TOKEN cannot dispatch into another repo, so this
      # uses HOMEBREW_TAP_TOKEN (a PAT with access to aio-proxy/homebrew-tap).
      - name: Notify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo 'HOMEBREW_TAP_TOKEN secret is not configured' >&2
            exit 1
          fi
          version="$(gh release view --json tagName --jq '.tagName')"
          version="${version#v}"
          GH_TOKEN="${HOMEBREW_TAP_TOKEN}" gh api --method POST \
            repos/aio-proxy/homebrew-tap/dispatches \
            --input - <<EOF
          {"event_type":"aio-proxy-release","client_payload":{"version":"${version}"}}
          EOF
