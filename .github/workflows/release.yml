name: Release

# Changesets owns the release. On every push to main the action either:
#   - maintains the standing "chore: release" Version PR (when changesets exist), or
#   - runs the publish script (when none exist, i.e. right after that PR merged).
# Cutting a release therefore = merging the Version PR. See .changeset/config.json
# and scripts/release.ts.
#
# TODO(oven-sh/bun#39764): after Bun's compile-on-darwin signature is accepted
# on macOS 27, this job can return to ubuntu-latest (cross-compile, no resign).
# Until then release runs on macOS so `bun build --compile` + `codesign` happen
# on the same machine. Compile only runs on the publish path inside
# scripts/release.ts. The Linux Docker image stays on Ubuntu — GitHub macOS
# runners do not ship Docker.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump commit + git tag(s)
  pull-requests: write # open/update the Version PR
  id-token: write # npm OIDC trusted publishing (+ provenance)
  packages: write # push the Docker image to GHCR

jobs:
  release:
    runs-on: macos-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs['published-packages'] }}
    env:
      # lefthook's postinstall no-ops when CI=true unless LEFTHOOK is set; without
      # installed hooks the release commit skips oxfmt/commitlint (e.g. CHANGELOG.md).
      LEFTHOOK: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the action can build the Version PR / changelog
          fetch-tags: true
          persist-credentials: false # avoid duplicate Authorization headers during changesets push

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version: '26' # bundles npm 11.17+, which supports OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      # v3-next line (CLI v3). Pinned to the built release tag's commit — `main`
      # does not commit dist/, so a branch/main SHA would not run. Bump this pin
      # (and the @changesets/* devDependencies) together when upgrading.
      - name: Changesets — maintain Version PR or publish
        id: changesets
        uses: changesets/action@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          # This action uses kebab-case inputs and HARD-FAILS if given any legacy
          # name (publish/version/commit/title/setupGitUser/createGithubReleases/…).
          # Defaults we rely on: version-script=`changeset version`,
          # create-github-releases=true, push-git-tags=true, setup-git-user=true —
          # so we only set the publish script and the commit/PR title.
          publish-script: bun run scripts/release.ts
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          # PR creation / GitHub Release / @changesets/changelog-github links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap credential for the FIRST publish of each package: OIDC trusted
          # publishing cannot create a package that does not yet exist on npm (there
          # is nowhere to configure a trusted publisher until the package exists).
          # Set the NPM_TOKEN secret to an automation token for the initial release,
          # then, once every package exists and its trusted publisher is configured
          # on npmjs.com, delete the secret so this resolves to empty and publishing
          # runs on OIDC alone.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Where release.ts drops the platform tarball sha256s for the Homebrew tap.
          # Only written on the publish path.
          HOMEBREW_CHECKSUMS_PATH: ${{ runner.temp }}/homebrew-checksums.json

      # homebrew-tap listens for repository_dispatch aio-proxy-release and commits a
      # formula update. GITHUB_TOKEN cannot dispatch into another repo, so this uses
      # HOMEBREW_TAP_TOKEN (a PAT with access to aio-proxy/homebrew-tap).
      #
      # The version and the per-platform sha256s both come from the checksum file
      # release.ts wrote, NOT from `gh release view` and NOT from the tap
      # re-downloading the tarballs. That keeps the formula update independent of
      # npm's CDN, whose tarball reads lag publish by minutes (see release.ts).
      # `published` gates this the same way it gates the docker job: a push to main
      # with changesets pending only refreshes the Version PR, and dispatching then
      # would rerun the tap against the previous release for nothing.
      - name: Notify Homebrew tap
        if: steps.changesets.outputs.published == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CHECKSUMS_PATH: ${{ runner.temp }}/homebrew-checksums.json
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo 'HOMEBREW_TAP_TOKEN secret is not configured' >&2
            exit 1
          fi
          if [ ! -s "${CHECKSUMS_PATH}" ]; then
            echo "release.ts wrote no checksums to ${CHECKSUMS_PATH}" >&2
            exit 1
          fi
          # client_payload caps top-level properties at 10; version + checksums = 2.
          jq -c '{event_type: "aio-proxy-release", client_payload: .}' "${CHECKSUMS_PATH}" \
            | GH_TOKEN="${HOMEBREW_TAP_TOKEN}" gh api --method POST \
              repos/aio-proxy/homebrew-tap/dispatches --input -

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Publish a multi-arch Docker image to GHCR. Bun cross-compiles both musl
      # targets from this amd64 runner, so buildx builds linux/amd64 and
      # linux/arm64 in one pass without QEMU emulating the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aio-proxy/aio-proxy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ fromJSON(needs.release.outputs['published-packages'])[0].version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
