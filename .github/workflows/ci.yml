name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not a default type. Without it, marking a draft ready
    # would never start this job after the draft skip below.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  preflight-and-unit:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --prefer-offline: the actions/cache step above restores ~/.bun/install/cache,
      # so skip revalidating cached manifests. Not --offline, which hard-fails on a
      # cache miss (guaranteed whenever bun.lock changes the cache key).
      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun run check
      - run: test -f packages/core/src/db/migrations/meta/_journal.json
      - run: bun run --filter @aio-proxy/core build:migrations
      - run: test -z "$(git status --short --untracked-files=all -- packages/core/src/db/migrations)"
      - run: bun run --filter @aio-proxy/brand build:assets
      - run: test -z "$(git status --short --untracked-files=all -- packages/brand/src)"
      # lint:types resolves cross-package imports through each package's built dist/*.d.ts, so the
      # build has to land first — unbuilt, every workspace import reports as an unresolved type.
      # test:unit already dependsOn build, so this only moves that work earlier and warms its cache.
      - run: bun run build
      - run: bun run --filter @aio-proxy/website build
      - run: bun run --filter @aio-proxy/website api:check
      - run: bun run --filter @aio-proxy/website test
      - run: bun run lint:types
      - run: bun run test:unit -- --concurrency=2
      - run: bun run test:e2e:api

  desktop-changes:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      bundle: ${{ steps.diff.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed() {
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo true
            elif git diff --quiet "$BASE...HEAD" -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          echo "rust=$(changed desktop npm/aio-proxy/package.json packages/types/src/desktop-summary/fixtures .github/workflows/ci.yml)" >> "$GITHUB_OUTPUT"
          # Server and dashboard changes are left out to spare macOS minutes; the release desktop job
          # always runs the full runtime smoke before signing (spec "CI").
          echo "bundle=$(changed desktop packages/cli/scripts packages/brand/src/apple-icon.icon .github/workflows bun.lock .bun-version)" >> "$GITHUB_OUTPUT"

  rust:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.rust == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target aarch64-apple-darwin
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  bundle-smoke:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.bundle == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-desktop-bundle-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-bundle-

      # actool compiles the app icon from an Icon Composer document, which needs Xcode 26.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          [[ -n "$xcode" ]] || { echo "no Xcode 26 on this runner" >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      # Build, Mach-O checks, runtime smoke, ad-hoc hardened signature, then the signed smoke with
      # the JIT check.
      - run: bun run desktop:bundle --unsigned
