name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Changesets guard: the `fixed` group must list every workspace package so
      # the whole workspace stays on one lockstep version.
      - run: bun run scripts/check-lockstep-fixed.ts

      - run: bun run check
      - run: test -f packages/core/src/db/migrations/meta/_journal.json
      - run: bun run --filter @aio-proxy/core build:migrations
      - run: test -z "$(git status --short --untracked-files=all -- packages/core/src/db/migrations)"
      - run: bun run test:unit -- --concurrency=2
      - run: bun run test:e2e:api
