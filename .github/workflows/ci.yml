name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not a default type. Without it, marking a draft ready
    # would never start this job after the draft skip below.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  preflight-and-unit:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --prefer-offline: the actions/cache step above restores ~/.bun/install/cache,
      # so skip revalidating cached manifests. Not --offline, which hard-fails on a
      # cache miss (guaranteed whenever bun.lock changes the cache key).
      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun run check
      - run: test -f packages/core/src/db/migrations/meta/_journal.json
      - run: bun run --filter @aio-proxy/core build:migrations
      - run: test -z "$(git status --short --untracked-files=all -- packages/core/src/db/migrations)"
      - run: bun run --filter @aio-proxy/brand build:assets
      - run: test -z "$(git status --short --untracked-files=all -- packages/brand/src)"
      # lint:types resolves cross-package imports through each package's built dist/*.d.ts, so the
      # build has to land first — unbuilt, every workspace import reports as an unresolved type.
      # test:unit already dependsOn build, so this only moves that work earlier and warms its cache.
      - run: bun run build
      - run: bun run --filter @aio-proxy/website build
      - run: bun run --filter @aio-proxy/website api:check
      - run: bun run --filter @aio-proxy/website test
      - run: bun run lint:types
      - run: bun run test:unit -- --concurrency=2
      - run: bun run test:e2e:api

  cli-windows:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline
      # The CLI tests resolve workspace packages through their built dist.
      - run: bun run build
      - run: bun run test:unit src/service src/service-run src/win32-ffi src/desktop-connect src/upgrade
        working-directory: packages/cli
      - run: bun test src/desktop-token
        working-directory: packages/core

  desktop-changes:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      bundle: ${{ steps.diff.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed() {
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo true
            elif git diff --quiet "$BASE...HEAD" -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          echo "rust=$(changed desktop npm/aio-proxy/package.json packages/types/src/desktop-summary/fixtures .github/workflows/ci.yml)" >> "$GITHUB_OUTPUT"
          # Server and dashboard changes are left out to spare macOS minutes; the release desktop job
          # always runs the full runtime smoke before signing (spec "CI").
          echo "bundle=$(changed desktop packages/cli/scripts packages/brand/src/app-icon.icon .github/workflows bun.lock .bun-version)" >> "$GITHUB_OUTPUT"

  rust:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The toolchain step is bash; Windows runners default to PowerShell.
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  bundle-smoke:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.bundle == 'true'
    # actool compiles the app icon from its Icon Composer document only with Xcode 26 on macOS 26.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-desktop-bundle-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-bundle-

      # Build, Mach-O checks, runtime smoke, ad-hoc hardened signature, then the signed smoke with
      # the JIT check.
      - run: bun run desktop:bundle --unsigned

  service-smoke:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sidecar: linux-x64
            exec: aio-proxy
          - os: windows-2025
            sidecar: win32-x64
            exec: aio-proxy.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun run build
      - run: bun packages/cli/scripts/build-binary.ts ${{ matrix.sidecar }} "$RUNNER_TEMP/sidecar/${{ matrix.exec }}"

      # A runner job has no login session, so this user has no systemd --user manager until lingering
      # starts one.
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "$runtime/systemd/private" ] && break
            sleep 1
          done
          test -S "$runtime/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"

      - run: bun desktop/scripts/smoke/cli.ts --service "$RUNNER_TEMP/sidecar/${{ matrix.exec }}"

  desktop-package:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu LTS keeps the AppImage's glibc floor low.
          - os: ubuntu-22.04
            target: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
            asset: aio-proxy-0.0.1-x86_64.AppImage
          - os: windows-2025
            target: windows-x86_64
            rust-target: x86_64-pc-windows-msvc
            asset: aio-proxy-0.0.1-x64-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline

      # libfuse2 runs linuxdeploy's AppImage plugins.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev pkg-config libfuse2

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target ${{ matrix.rust-target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-desktop-package-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-package-

      # `cargo install` skips a matching install it finds in ~/.cargo/bin plus its .crates*.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-packager*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-packager-0.11.8

      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: bun run desktop:package --target ${{ matrix.target }} --version 0.0.1

      - name: Check the AppImage's bundled binaries
        if: runner.os == 'Linux'
        working-directory: desktop/target/package
        run: |
          ./${{ matrix.asset }} --appimage-extract > /dev/null
          test "$(squashfs-root/usr/bin/aio-proxy --version)" = 0.0.1
          test "$(squashfs-root/usr/bin/aio-proxy-desktop --version)" = 0.0.1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: desktop/target/package/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
