name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # `website/docs/public/install.sh` is served as https://aioproxy.dev/install.sh,
      # so the curl installer ships through this deploy too.
      - 'website/**'
      # The website renders its nav wordmark and favicon from these packages, so a commit that
      # touches only them still changes the deployed site.
      - 'packages/brand/**'
      - 'packages/ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-pages
  cancel-in-progress: false

jobs:
  # Deploys this repository's own Pages site, served at the apex of the aioproxy.dev
  # custom domain (set in Settings -> Pages). The custom domain is what drops the
  # default `/aio-proxy` project-site path prefix, so `base` stays `/` in
  # website/rspress.config.ts and the site no longer has to be pushed to
  # aio-proxy/aio-proxy.github.io to reach a domain root.
  #
  # No CNAME file: GitHub ignores one when the publishing source is a workflow.
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to the Pages environment
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun run --filter @aio-proxy/website build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - id: deploy
        uses: actions/deploy-pages@v5
