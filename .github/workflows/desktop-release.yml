name: Desktop release

# Builds, signs, notarizes and publishes the macOS app for one released version, then replaces the
# Sparkle feed on the desktop-feed prerelease (docs/superpowers/specs/2026-09-29-desktop-client-design.md,
# "Release job and feed"). Beside it, the Linux AppImages and the Windows installer are built without
# secrets, signed and attached by publish-assets, and the feed job points latest.json on desktop-feed at
# the highest complete version (docs/superpowers/specs/2026-10-02-windows-linux-desktop-design.md, section
# 6). macOS and Linux/Windows publish independently, so a failure on one side never holds the other; a
# failed Linux or Windows build holds all three Linux/Windows uploads, since the feed needs every one.
# release.yml dispatches it after a publish, so it runs as its own workflow run and never holds the
# release concurrency group. A maintainer can dispatch it with the tag to resume a failed desktop publish
# for the same immutable version; it never re-runs the npm publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.36.0
        type: string
        required: true

jobs:
  desktop:
    # A dispatch picks the ref whose copy of this file runs, so a branch could drop every check below.
    # The release secrets belong to the desktop-release environment, whose deployment branches allow
    # only main (repository settings); this guard only stops an honest dispatch from another ref.
    if: github.ref == 'refs/heads/main'
    environment: desktop-release
    permissions:
      contents: write # upload the .dmg and replace appcast.xml on desktop-feed
    # actool compiles the app icon from its Icon Composer document only with Xcode 26 on macOS 26.
    runs-on: macos-26
    timeout-minutes: 90
    # Every run replaces the same appcast.xml.
    concurrency:
      group: desktop-feed
      cancel-in-progress: false
    steps:
      # Same gate as the verify job's two steps below: change both together.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable X.Y.Z release: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The later steps run this tag's scripts with the signing identity, the notary key and the
      # Sparkle key, so only a tag the release job published runs: a non-draft, non-prerelease
      # Release whose commit is on main. The checkout pins that commit, not the movable tag.
      - name: Verify the tag is a published release on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"') || {
            echo "no Release for $TAG" >&2
            exit 1
          }
          if [[ "$release" != "false false" ]]; then
            echo "$TAG is a draft or prerelease ($release)" >&2
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "$TAG ($sha) is not on main (compare status: $status)" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Actions in this job run before the release secrets are used, so they are pinned to reviewed
      # commits rather than movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin

      # Signing material comes from the organization's APPLE_* secrets; the scripts keep their own
      # names (also used for local releases), mapped here.
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the notary API key
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, verify and publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bun run desktop:publish --version "$VERSION"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"

  # The macOS job's tag checks, for the Linux and Windows jobs. A local composite action cannot run
  # before the checkout it would come from, so the checks stay inline in both places.
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Same gate as the macOS job's first two steps: change both together.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable X.Y.Z release: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is a published release on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"') || {
            echo "no Release for $TAG" >&2
            exit 1
          }
          if [[ "$release" != "false false" ]]; then
            echo "$TAG is a draft or prerelease ($release)" >&2
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "$TAG ($sha) is not on main (compare status: $status)" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Build jobs hold no secrets and no write token: they only produce unsigned bytes for publish-assets.
  # No caches either, so a release is built only from the verified commit and the lockfiles.
  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu LTS keeps the AppImage's glibc floor low.
          - os: ubuntu-22.04
            target: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            rust-target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASSET: aio-proxy-${{ needs.verify.outputs.version }}-${{ matrix.arch }}.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      # libfuse2 runs linuxdeploy's AppImage plugins; squashfs-tools repacks the image with the original CLI.
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev pkg-config libfuse2 squashfs-tools

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target ${{ matrix.rust-target }}

      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: bun run desktop:package --target ${{ matrix.target }} --version "$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: desktop/target/package/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ASSET: aio-proxy-${{ needs.verify.outputs.version }}-x64-setup.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target x86_64-pc-windows-msvc

      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: bun run desktop:package --target windows-x86_64 --version "$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: desktop/target/package/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # Signs only bytes this run built and attaches them, .minisig first; resumable from any partial
  # state (desktop/scripts/publish-assets.ts). Writes only v<version>, so it needs no concurrency group.
  publish-assets:
    needs: [verify, build-linux, build-windows]
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # attach the builds and their .minisig files to v<version>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Sign and publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bun run desktop:publish-assets --version "$VERSION" --dir "$RUNNER_TEMP/artifacts"

  # Picks the highest complete stable version itself, whatever tag was dispatched, so a replaced pending
  # run cannot leave the feed behind. Its own group: it writes latest.json, the macOS job appcast.xml.
  feed:
    # Waits for the macOS job whatever its outcome: on a first release (or after desktop-feed was deleted to
    # rebuild the feeds) only that job may create desktop-feed, since publish.ts refuses a feed Release that
    # has no appcast.xml. A failed macOS job still lets Linux/Windows publish when the Release exists.
    needs: [verify, publish-assets, desktop]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish-assets.result == 'success' }}
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # replace latest.json on desktop-feed
    concurrency:
      group: desktop-feed-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Update latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: bun run desktop:publish-latest
