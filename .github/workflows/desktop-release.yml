name: Desktop release

# Builds, signs, notarizes and publishes the macOS app for one released version, then replaces the
# Sparkle feed on the desktop-feed prerelease (docs/superpowers/specs/2026-09-29-desktop-client-design.md,
# "Release job and feed"). release.yml dispatches it after a publish, so it runs as its own workflow
# run and never holds the release concurrency group. A maintainer can dispatch it with the tag to
# resume a failed desktop publish for the same immutable version; it never re-runs the npm publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.36.0
        type: string
        required: true

permissions:
  contents: write # upload the .dmg and replace appcast.xml on desktop-feed

jobs:
  desktop:
    # A dispatch picks the ref whose copy of this file runs, so a branch could drop every check below.
    # The release secrets belong to the desktop-release environment, whose deployment branches allow
    # only main (repository settings); this guard only stops an honest dispatch from another ref.
    if: github.ref == 'refs/heads/main'
    environment: desktop-release
    runs-on: macos-15
    timeout-minutes: 90
    # Every run replaces the same appcast.xml.
    concurrency:
      group: desktop-feed
      cancel-in-progress: false
    steps:
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable X.Y.Z release: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The later steps run this tag's scripts with the signing identity, the notary key and the
      # Sparkle key, so only a tag the release job published runs: a non-draft, non-prerelease
      # Release whose commit is on main. The checkout pins that commit, not the movable tag.
      - name: Verify the tag is a published release on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"') || {
            echo "no Release for $TAG" >&2
            exit 1
          }
          if [[ "$release" != "false false" ]]; then
            echo "$TAG is a draft or prerelease ($release)" >&2
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "$TAG ($sha) is not on main (compare status: $status)" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Actions in this job run before the release secrets are used, so they are pinned to reviewed
      # commits rather than movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      # actool compiles the app icon from an Icon Composer document, which needs Xcode 26.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          [[ -n "$xcode" ]] || { echo "no Xcode 26 on this runner" >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile --prefer-offline

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin

      # Signing material comes from the organization's APPLE_* secrets; the scripts keep their own
      # names (also used for local releases), mapped here.
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the notary API key
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, verify and publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bun run desktop:publish --version "$VERSION"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
