[package]
name = "aio-proxy-desktop"
# The shipped version comes from npm/aio-proxy/package.json (build.rs); this one is never published.
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# GPUI Kit pins an exact gpui-pre snapshot; bump this deliberately.
gpui-kit = "=0.7.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
url = "2.5.8"
# Already in the tree through GPUI; only PNG, for the bundled tray mark.
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# GPUI ships no HTTP client on native platforms; this one loads remote plugin icons for `img()`.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Environment",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# Already in the tree through GPUI (same version); only for the DXGI adapter query, which is COM.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

# The Linux and Windows in-app updater; minisign-verify is its verifier (same version), used to read
# the signed trusted comment.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
cargo-packager-updater = "0.2.3"
minisign-verify = "=0.2.5"
base64 = "0.22.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.25.1"

# The StatusNotifierItem (D-Bus) backend, without GTK.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
# Already in the tree through ksni; watches for the tray host (StatusNotifierWatcher).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSFont",
  "NSAffineTransform",
  "NSAttributedString",
  "NSStringDrawing",
  "NSGraphicsContext",
  "NSFontDescriptor",
  "NSColor",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSScreen",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSAffineTransform",
  "NSAttributedString",
  "NSGeometry",
  "NSBundle",
  "NSDictionary",
  "NSData",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSValue",
  "block2",
] }
block2 = "0.6.2"

# The panel's native window (NSWindow, HWND) from GPUI's public handle.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
raw-window-handle = "0.6.2"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1.0.151"

# The exe's icon and its per-monitor DPI manifest; GPUI sets no DPI awareness itself.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

# Linux and Windows packages. desktop/scripts/package.ts reads this table, adds the release version,
# the sidecar and the paths it builds, and passes the whole config to `cargo packager --config`, which
# replaces this table rather than merging with it. Run `bun run desktop:package`, not `cargo packager`.
[package.metadata.packager]
product-name = "AIO Proxy"
identifier = "com.aio-proxy.desktop"
description = "AIO Proxy"
category = "Developer Tool"
binaries = [{ path = "aio-proxy-desktop", main = true }]
icons = ["packaging/icons/*.png"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "packaging/icons/icon.ico"

# The AppImage's .desktop entry: cargo-packager's default with StartupWMClass (the window's app id,
# so docks match the window to the entry) and no trailing argument placeholder on Exec.
[package.metadata.packager.deb]
desktop-template = "packaging/linux/main.desktop"

# GPUI loads these with dlopen, which linuxdeploy's ELF scan cannot see; it bundles the linked
# libraries (xkbcommon, xkbcommon-x11) on its own.
[package.metadata.packager.appimage]
libs = ["libwayland-client.so.0", "libvulkan.so.1"]

[profile.release]
lto = "thin"
