[package]
name = "aio-proxy-desktop"
# The shipped version comes from npm/aio-proxy/package.json (build.rs); this one is never published.
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# GPUI Kit pins an exact gpui-pre snapshot; bump this deliberately.
gpui-kit = "=0.7.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
url = "2.5.8"
# Already in the tree through GPUI; only PNG, for the bundled tray mark.
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# GPUI ships no HTTP client on native platforms; this one loads remote plugin icons for `img()`.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Environment",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.25.1"

# The StatusNotifierItem (D-Bus) backend, without GTK.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
# Already in the tree through ksni; watches for the tray host (StatusNotifierWatcher).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSGraphics",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSScreen",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSBundle",
  "NSDictionary",
  "NSData",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSValue",
  "block2",
] }
block2 = "0.6.2"
raw-window-handle = "0.6.2"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = "thin"
