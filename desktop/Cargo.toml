[package]
name = "aio-proxy-desktop"
# The shipped version comes from npm/aio-proxy/package.json (build.rs); this one is never published.
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# GPUI Kit pins an exact gpui-pre snapshot; bump this deliberately.
gpui-kit = "=0.7.0"
tray-icon = "0.25.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSGraphics",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSScreen",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSBundle",
  "NSDictionary",
  "NSData",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSURLResponse",
  "NSURLSession",
  "NSValue",
  "block2",
] }
block2 = "0.6.2"
raw-window-handle = "0.6.2"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
url = "2.5.8"
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = "thin"
